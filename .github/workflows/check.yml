name: Check

# Cloudflare's build is the other required check, but `astro build` doesn't
# typecheck, so this runs `astro check` on every PR and push to main. The job
# name, "Typecheck", is what the main ruleset requires: rename it there too.

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR cancels the run still going.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  typecheck:
    name: Typecheck
    # Pinned rather than ubuntu-latest, so a runner image change never fails
    # a PR that didn't touch anything.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
